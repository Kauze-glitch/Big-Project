services:
  - type: web
    name: zyro-club-form
    runtime: node
    plan: free
    region: singapore
    rootDir: zyro-club-form
    buildCommand: npm ci
    startCommand: npm start
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: zyro-form-db
          property: connectionString
      - key: ADMIN_USER
        sync: false
      - key: ADMIN_PASSWORD
        sync: false

databases:
  - name: zyro-form-db
    plan: free
    region: singapore
    databaseName: zyro
    user: zyro_app
    ipAllowList: []
